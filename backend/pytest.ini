[pytest]
# Default to the CI-equivalent set: skip integration tests that need real
# agent CLIs (claude/codex/cursor) and the live bridge npm deps. Opt in
# locally by running `pytest tests/agents/test_integration.py` directly —
# an explicit path beats `--ignore` in collection. Matches AGENTS.md.
addopts = --ignore=tests/agents/test_integration.py
markers =
    integration: requires real agent CLIs and keys; excluded from CI (run locally).
