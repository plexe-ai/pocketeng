            Method: POST
        GetOwnTeam:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /teams/me
            Method: GET
        UpdateTeam:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /teams/{teamId}
            Method: PATCH
        ListTeamInvites:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /teams/{teamId}/invites
            Method: GET
        CreateTeamInvite:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /teams/{teamId}/invites
            Method: POST
        UpdateTeamMember:
          Type: HttpApi
