          Properties:
            ApiId: !Ref HttpApi
            Path: /servers/{serverId}/repo/download
            Method: GET

  GitFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src.git.handler
      Description: Git operations (diff, log, commit, create-pr) on a server workspace
      Timeout: 30
      MemorySize: 256
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ServersTable
        - DynamoDBReadPolicy:
            TableName: !Ref SessionsTable
        - DynamoDBReadPolicy:
            TableName: !Ref TeamMembershipsTable
        - Statement:
            - Effect: Allow
              Action:
                - kms:Decrypt
              Resource: !GetAtt EncryptionKey.Arn
