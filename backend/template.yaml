            Method: POST

  UploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src.upload.handler
      Description: Upload a file to an EC2 instance via SFTP
      Timeout: 30
      MemorySize: 256
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ServersTable
        - DynamoDBReadPolicy:
            TableName: !Ref TeamMembershipsTable
        - Statement:
            - Effect: Allow
              Action:
                - kms:Decrypt
              Resource: !GetAtt EncryptionKey.Arn
      Events:
        Upload:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /servers/{serverId}/upload
            Method: POST

  TranscribeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src.transcribe.handler
      Description: Transcribe a voice prompt via OpenAI Whisper
      # Whisper round-trip is usually 1-3s for short prompts but can
      # spike on the first invocation after a cold start. 30s leaves
      # generous headroom without being a footgun for runaway calls.
      Timeout: 30
      # Most of the work is a single HTTP round-trip; memory is only
      # needed to hold the base64 blob + decoded bytes (capped at 25MB).
      MemorySize: 512
      Environment:
        Variables:
          OPENAI_API_KEY: !Ref OpenaiApiKey
      Events:
        Transcribe:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /transcribe
            Method: POST

