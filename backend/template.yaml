                - kms:Encrypt
              Resource: !GetAtt EncryptionKey.Arn
      Events:
        StoreAwsCredentials:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /account/aws-credentials
            Method: POST
        GetAwsCredentials:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /account/aws-credentials
            Method: GET
        DeleteAwsCredentials:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /account/aws-credentials
            Method: DELETE

  TeamFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src.team.handler
      Description: Team lifecycle, membership, and invite management
      Environment:
        Variables:
          # Resend (transactional email). Both empty in dev / pre-DNS
          # environments — `email.send_email` no-ops cleanly when so.
          # The inviter is rendered from the JWT email claim, so we
          # deliberately do NOT wire SUPABASE_SERVICE_ROLE_KEY in here
