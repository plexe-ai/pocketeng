  # ─── Slack Integration ────────────────────────────────────────────────────────

  SlackCommandFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src.slack_command.handler
      Description: Receive Slack slash commands and dispatch to worker
      Timeout: 5
      Environment:
        Variables:
          WORKER_FUNCTION_NAME: !Ref SlackWorkerFunction
          SLACK_SIGNING_SECRET: !Ref SlackSigningSecret
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !GetAtt SlackWorkerFunction.Arn
      Events:
        SlackCommand:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /slack/command
            Method: POST

  SlackEventsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src.slack_events.handler
      Description: Receive Slack Events API (app_mention) and dispatch to worker
      Timeout: 5
      Environment:
        Variables:
          WORKER_FUNCTION_NAME: !Ref SlackWorkerFunction
          SLACK_SIGNING_SECRET: !Ref SlackSigningSecret
          SLACK_MAPPINGS_TABLE: !Ref SlackMappingsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SlackMappingsTable
        - Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !GetAtt SlackWorkerFunction.Arn
      Events:
        SlackEvents:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /slack/events
            Method: POST

  SlackRegisterFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src.slack_register.handler
      Description: Register Slack team to PE user mapping
      Timeout: 10
      Environment:
        Variables:
          SLACK_MAPPINGS_TABLE: !Ref SlackMappingsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SlackMappingsTable
      Events:
        Register:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /slack/register
            Method: POST

  SlackWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src.slack_worker.handler
      Description: Async worker — SSH into env, run Claude Code, post to Slack
      Timeout: 300
      MemorySize: 256
      Environment:
        Variables:
          SLACK_MAPPINGS_TABLE: !Ref SlackMappingsTable
          SESSIONS_TABLE: !Ref SessionsTable
          MESSAGES_TABLE: !Ref MessagesTable
          AGENT_CREDENTIALS_TABLE: !Ref AgentCredentialsTable
          PUBLIC_API_BASE_URL: !Ref PublicApiBaseUrl
          COMPLETION_CALLBACK_SECRET: !Ref CompletionCallbackSecret
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ServersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SlackMappingsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MessagesTable
        # Read-only access to team-auth tables — _launch_turn calls
        # can_manage_owned_resource → is_team_admin for team-owned workspaces.
        - DynamoDBReadPolicy:
            TableName: !Ref TeamsTable
        - DynamoDBReadPolicy:
            TableName: !Ref TeamMembershipsTable
        # Read-only access for the agent-credentials sync on turn launch.
        - DynamoDBReadPolicy:
            TableName: !Ref AgentCredentialsTable
        - Statement:
            - Effect: Allow
              Action:
                - ec2:DescribeInstances
                - ec2:StartInstances
              Resource: "*"
        - Statement:
            - Effect: Allow
              Action:
                - kms:Decrypt
              Resource: !GetAtt EncryptionKey.Arn

