AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: PocketEngineer managed server backend

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        SERVERS_TABLE: !Ref ServersTable
        TEAMS_TABLE: !Ref TeamsTable
        TEAM_MEMBERSHIPS_TABLE: !Ref TeamMembershipsTable
        TEAM_INVITES_TABLE: !Ref TeamInvitesTable
        KMS_KEY_ID: !Ref EncryptionKey
        SUPABASE_URL: !Ref SupabaseUrl
        SUPABASE_JWT_SECRET: !Ref SupabaseJwtSecret
        # Shared Anthropic key used for the quick-start / trial flow — a
        # user signing up for the first time can click one button and
        # start chatting without having to paste their own API key.
        # Substituted in provision.py ONLY when the request body has
        # `trial: true` AND no user-provided anthropicApiKey. Empty string
        # disables trial mode (the button will still work but the workspace
        # won't have an agent credential until the user connects their own).
        PE_TRIAL_ANTHROPIC_KEY: !Ref TrialAnthropicKey

Parameters:
  Stage:
    Type: String
    Default: prod
    AllowedValues: [prod, dev]
  DomainName:
    Type: String
    Default: api.pocketeng.co
  SupabaseUrl:
    Type: String
    Description: Your Supabase project URL
    Default: "https://yourproject.supabase.co"
  SupabaseJwtSecret:
    Type: String
    Description: Supabase JWT secret for token verification
    NoEcho: true
    Default: "your-jwt-secret-here"
  TrialAnthropicKey:
    Type: String
    Description: "Shared Anthropic API key for the quick-start trial flow. Used only when the provision request sets trial=true AND the user hasn't supplied their own key. Leave empty to disable trial mode."
    NoEcho: true
    Default: ""
  SupabaseServiceRoleKey:
    Type: String
    Description: Supabase service role key for privileged auth admin operations
    NoEcho: true
    Default: ""
  ResendApiKey:
    Type: String
    Description: |
      Resend API key for transactional onboarding emails (workspace-ready
      notification today; welcome / lifecycle later). When empty, email
      sends are silently skipped — backend behavior unchanged.
    NoEcho: true
    Default: ""
  ResendFrom:
    Type: String
    Description: |
      Sender address for transactional emails, in RFC 5322 format
      (e.g. "Pocket Eng <hello@pocketeng.ai>"). The domain must be
      verified in Resend's dashboard with SPF / DKIM / DMARC records
      live or sends will 422. Empty disables email.
    Default: ""
  UnsubscribeSecret:
    Type: String
    Description: |
      HMAC secret used to mint and verify email unsubscribe tokens.
      Generated once with `openssl rand -hex 32`. Rotating it
      invalidates all previously-sent unsubscribe links — only do that
      if you've reason to believe the old secret leaked.
    NoEcho: true
    Default: ""
  AppleClientId:
    Type: String
    Description: Apple Sign in Services ID (client_id) used for token revocation
    Default: ""
  AppleTeamId:
    Type: String
    Description: Apple Developer Team ID used to sign the client secret JWT
    Default: ""
  AppleKeyId:
    Type: String
    Description: Apple Sign in key ID for the .p8 private key
    Default: ""
  ApplePrivateKeyB64:
    Type: String
    Description: Base64-encoded contents of the Apple Sign in .p8 private key
    NoEcho: true
    Default: ""
  PublicApiBaseUrl:
    Type: String
    Description: Public HTTPS base URL used by remote completion callbacks
    Default: ""
  CompletionCallbackSecret:
    Type: String
    Description: Shared secret used by remote completion callbacks
    NoEcho: true
    Default: ""
  ApnsPlatformApplicationArn:
    Type: String
    Description: SNS platform application ARN for production APNs
    Default: ""
  ApnsSandboxPlatformApplicationArn:
    Type: String
    Description: SNS platform application ARN for sandbox APNs
    Default: ""
  FcmPlatformApplicationArn:
    Type: String
    Description: SNS platform application ARN for FCM (Android push)
    Default: ""
  SlackSigningSecret:
    Type: String
    Description: Slack app signing secret (optional)
    NoEcho: true
    Default: ""
  LinqApiKey:
    Type: String
    Description: Linq API bearer token for SMS
    NoEcho: true
    Default: ""
  LinqFromNumber:
    Type: String
    Description: Linq sender phone number (E.164 format)
    Default: ""
  LinqSigningSecret:
    Type: String
    Description: Linq webhook signing secret
    NoEcho: true
    Default: ""
  LinearWebhookSecret:
    Type: String
    Description: Linear webhook signing secret
    NoEcho: true
    Default: ""
  OpenaiApiKey:
    Type: String
    Description: OpenAI API key — used for voice prompt transcription (Whisper)
    NoEcho: true
    Default: ""
  LinearClientId:
    Type: String
    Description: Linear OAuth client ID (for app-level tokens)
    Default: ""
  LinearClientSecret:
    Type: String
    Description: Linear OAuth client secret
    NoEcho: true
    Default: ""
  RetellWebhookSecret:
    Type: String
    Description: Shared secret that Retell includes on voice tool-call webhook URLs
    NoEcho: true
    Default: ""
  CloudflareApiToken:
    Type: String
    Description: |
      Cloudflare API token with these scopes:
        - Cloudflare Tunnel: Edit     (tunnel CRUD)
        - Zone → DNS: Edit            (per-workspace CNAME)
        - Zone → Workers Routes: Edit (initial worker deploy only)
        - Workers KV Storage: Edit    (workspace→tunnel map writes)
        - Account: Read
      Used by provision / chat / action to manage per-workspace
      Cloudflare Tunnels, their CNAMEs, and the Workers-KV namespace
      the preview proxy Worker reads. Empty disables the feature —
      provision skips tunnel creation and preview URLs fall back to
      the legacy /api/preview proxy.
    NoEcho: true
    Default: ""
  CloudflareAccountId:
    Type: String
    Description: Cloudflare account ID that owns the preview tunnels.
    Default: ""
  CloudflareZoneId:
    Type: String
    Description: |
      Zone id for the preview domain (e.g. zone id for `pocketeng.co`).
      Every managed workspace gets ONE CNAME under this zone:
      `w-<wsId>.<preview-domain>` → `<tunnelId>.cfargotunnel.com`.
      Find it in the CF dashboard → Websites → pick domain → Overview.
    Default: ""
  CloudflarePreviewDomain:
    Type: String
    Description: |
      Apex zone for per-workspace preview CNAMEs — e.g. `pocketeng.co`.
      Combined with the `w-<wsId>` prefix to form the workspace public
      hostname. Must be the domain whose zone id is in
      CloudflareZoneId above.
    Default: ""
  CloudflareKvNamespaceId:
    Type: String
    Description: |
      Workers-KV namespace id for the `workspaceId → tunnelId` map
      that the `pe-preview-proxy` Worker reads. Create with
      `wrangler kv:namespace create TUNNEL_MAP` from
      `cloudflare-worker/preview-proxy/`; then paste the returned id
      here AND into the Worker's `wrangler.toml`.
    Default: ""
  CloudflarePreviewWorkerUrl:
    Type: String
    Description: |
      Public base URL of the deployed `pe-preview-proxy` Worker —
      e.g. `https://preview.pocketeng.co`. Combined with
      `{serverId}-{port}/` to form every managed-workspace preview
      URL. Must match NEXT_PUBLIC_CLOUDFLARE_PREVIEW_WORKER_URL on
      the frontend.
    Default: ""

Resources:
  # ─── API Gateway ──────────────────────────────────────────────────────────────

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: ["GET", "POST", "PATCH", "DELETE", "OPTIONS"]
        AllowHeaders: ["Authorization", "Content-Type"]

  # ─── Lambda Functions ─────────────────────────────────────────────────────────

  ProvisionFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src.provision.handler
      Description: Provision EC2 instance for managed user
      Timeout: 60
      Environment:
        Variables:
          AGENT_CREDENTIALS_TABLE: !Ref AgentCredentialsTable
          # Name of the Lambda to async-invoke once provision records are
          # saved. FinalizeFunction drives readiness → "ready".
          FINALIZE_FUNCTION_NAME: !Ref FinalizeFunction
          # Cloudflare Tunnel + KV config — used to create one tunnel
          # per new workspace, write the `workspaceId → tunnelId`
          # entry the preview Worker reads, and bake the connector
          # token into userdata so the EC2 host brings up cloudflared
          # on first boot. Empty values disable the feature entirely
          # (provision will log + skip).
          CLOUDFLARE_API_TOKEN: !Ref CloudflareApiToken
          CLOUDFLARE_ACCOUNT_ID: !Ref CloudflareAccountId
          CLOUDFLARE_ZONE_ID: !Ref CloudflareZoneId
          CLOUDFLARE_PREVIEW_DOMAIN: !Ref CloudflarePreviewDomain
          CLOUDFLARE_KV_NAMESPACE_ID: !Ref CloudflareKvNamespaceId
          CLOUDFLARE_PREVIEW_WORKER_URL: !Ref CloudflarePreviewWorkerUrl
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ServersTable
        - DynamoDBReadPolicy:
            TableName: !Ref TeamsTable
        - DynamoDBReadPolicy:
            TableName: !Ref TeamMembershipsTable
        - DynamoDBReadPolicy:
            TableName: !Ref AgentCredentialsTable
        - Statement:
            - Effect: Allow
              Action:
                - ec2:RunInstances
                - ec2:CreateSecurityGroup
                - ec2:AuthorizeSecurityGroupIngress
                - ec2:ImportKeyPair
                - ec2:DescribeImages
                - ec2:CreateTags
                - ec2:AllocateHosts
                - ec2:DescribeInstanceTypeOfferings
              Resource: "*"
        - Statement:
            - Effect: Allow
              Action:
                - kms:Encrypt
              Resource: !GetAtt EncryptionKey.Arn
        - Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !GetAtt FinalizeFunction.Arn
      Events:
        Provision:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /servers
            Method: POST

  FinalizeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src.finalize.handler
      Description: |
        Drive a freshly-provisioned workspace to readiness.status="ready".
        Invoked async by ProvisionFunction after put_server; also callable
        directly via POST /servers/{id}/finalize for manual retries.
      # Userdata + SSH wait + auth verify can take 2-3 minutes on a cold
      # Amazon Linux 2023 boot. Keep well above _MAX_SECONDS in finalize.py.
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          AGENT_CREDENTIALS_TABLE: !Ref AgentCredentialsTable
          # Used to look up user.email for the "workspace ready"
          # transactional email. Same admin key account.py uses for
          # account deletion. Email send is best-effort — finalize
          # never fails if email errors.
          SUPABASE_SERVICE_ROLE_KEY: !Ref SupabaseServiceRoleKey
          # Resend (transactional email). Both empty in dev / pre-DNS
          # environments — `email.send_email` no-ops cleanly when so.
          RESEND_API_KEY: !Ref ResendApiKey
          RESEND_FROM: !Ref ResendFrom
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ServersTable
        - DynamoDBReadPolicy:
            TableName: !Ref AgentCredentialsTable
        - Statement:
            - Effect: Allow
              Action:
                - ec2:DescribeInstances
              Resource: "*"
        - Statement:
            - Effect: Allow
              Action:
                - kms:Decrypt
              Resource: !GetAtt EncryptionKey.Arn
      Events:
        # Manual retry — user can POST /servers/{id}/finalize if they
        # reconnected an agent and want to re-run the auth verification.
        FinalizeRetry:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /servers/{serverId}/finalize
            Method: POST

  ServersFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src.servers.handler
      Description: List all managed servers for authenticated user
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ServersTable
        - DynamoDBReadPolicy:
            TableName: !Ref TeamsTable
        - DynamoDBReadPolicy:
            TableName: !Ref TeamMembershipsTable
        - Statement:
            - Effect: Allow
              Action:
                - ec2:DescribeInstances
              Resource: "*"
        - Statement:
            - Effect: Allow
              Action:
                - kms:Decrypt
              Resource: !GetAtt EncryptionKey.Arn
      Events:
        ListServers:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /servers
            Method: GET

  StatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src.status.handler
      Description: Get managed server status and deliver SSH key
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ServersTable
        - DynamoDBReadPolicy:
            TableName: !Ref TeamMembershipsTable
        - Statement:
            - Effect: Allow
              Action:
                - ec2:DescribeInstances
              Resource: "*"
        - Statement:
            - Effect: Allow
              Action:
                - kms:Decrypt
              Resource: !GetAtt EncryptionKey.Arn
      Events:
        Status:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /servers/{serverId}
            Method: GET
        Heartbeat:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /servers/{serverId}/heartbeat
            Method: POST

  ActionFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src.action.handler
      Description: Start/stop/terminate managed servers
      Timeout: 15
      Environment:
        Variables:
          # Needed by terminate to delete the workspace's Cloudflare
          # tunnel + Workers-KV entry. Other actions ignore these.
          CLOUDFLARE_API_TOKEN: !Ref CloudflareApiToken
          CLOUDFLARE_ACCOUNT_ID: !Ref CloudflareAccountId
          CLOUDFLARE_ZONE_ID: !Ref CloudflareZoneId
          CLOUDFLARE_PREVIEW_DOMAIN: !Ref CloudflarePreviewDomain
          CLOUDFLARE_KV_NAMESPACE_ID: !Ref CloudflareKvNamespaceId
          CLOUDFLARE_PREVIEW_WORKER_URL: !Ref CloudflarePreviewWorkerUrl
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ServersTable
        - DynamoDBReadPolicy:
            TableName: !Ref TeamMembershipsTable
        - Statement:
            - Effect: Allow
              Action:
                - ec2:StartInstances
                - ec2:StopInstances
                - ec2:TerminateInstances
                - ec2:DeleteSecurityGroup
                - ec2:DeleteKeyPair
                - ec2:ReleaseHosts
              Resource: "*"
        - Statement:
            - Effect: Allow
              Action:
                - kms:Encrypt
                - kms:Decrypt
              Resource: !GetAtt EncryptionKey.Arn
      Events:
        Action:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /servers/{serverId}/action
            Method: POST

  ChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src.chat.handler
      Description: Chat with coding agents via SSH
      Timeout: 120
      MemorySize: 256
      Environment:
        Variables:
          SESSIONS_TABLE: !Ref SessionsTable
          MESSAGES_TABLE: !Ref MessagesTable
          PUSH_DEVICES_TABLE: !Ref PushDevicesTable
          PUBLIC_API_BASE_URL: !Ref PublicApiBaseUrl
          COMPLETION_CALLBACK_SECRET: !Ref CompletionCallbackSecret
          APNS_PLATFORM_APPLICATION_ARN: !Ref ApnsPlatformApplicationArn
          APNS_SANDBOX_PLATFORM_APPLICATION_ARN: !Ref ApnsSandboxPlatformApplicationArn
          FCM_PLATFORM_APPLICATION_ARN: !Ref FcmPlatformApplicationArn
          LINEAR_CLIENT_ID: !Ref LinearClientId
          LINEAR_CLIENT_SECRET: !Ref LinearClientSecret
          HARNESS_RUN_SUMMARIES_TABLE: !Ref HarnessRunSummariesTable
          HARNESS_SUGGESTIONS_TABLE: !Ref HarnessSuggestionsTable
          HARNESS_RUN_SUMMARIES_TABLE: !Ref HarnessRunSummariesTable
          HARNESS_SUGGESTIONS_TABLE: !Ref HarnessSuggestionsTable
          AGENT_CREDENTIALS_TABLE: !Ref AgentCredentialsTable
          # Cloudflare Tunnel + KV config — _discover_services
          # registers a per-port ingress rule on the tunnel and (for
          # pre-migration workspaces without a tunnelId) lazy-creates
          # a tunnel, installs cloudflared via SSH, and writes the
          # workspace's KV entry so the preview Worker can find it.
          CLOUDFLARE_API_TOKEN: !Ref CloudflareApiToken
          CLOUDFLARE_ACCOUNT_ID: !Ref CloudflareAccountId
          CLOUDFLARE_ZONE_ID: !Ref CloudflareZoneId
          CLOUDFLARE_PREVIEW_DOMAIN: !Ref CloudflarePreviewDomain
          CLOUDFLARE_KV_NAMESPACE_ID: !Ref CloudflareKvNamespaceId
          CLOUDFLARE_PREVIEW_WORKER_URL: !Ref CloudflarePreviewWorkerUrl
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ServersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MessagesTable
        - DynamoDBReadPolicy:
            TableName: !Ref TeamMembershipsTable
        - DynamoDBReadPolicy:
            TableName: !Ref PushDevicesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref HarnessRunSummariesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref HarnessSuggestionsTable
        - DynamoDBReadPolicy:
            TableName: !Ref AgentCredentialsTable
        - Statement:
            - Effect: Allow
              Action:
                - ec2:DescribeInstances
              Resource: "*"
        - Statement:
            - Effect: Allow
              Action:
                - kms:Decrypt
              Resource: !GetAtt EncryptionKey.Arn
        - Statement:
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: "*"
      Events:
        Chat:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /servers/{serverId}/chat
            Method: POST

  HarnessFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src.harness.handler
      Description: Harness suggestions, history, and live rules
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          HARNESS_RUN_SUMMARIES_TABLE: !Ref HarnessRunSummariesTable
          HARNESS_SUGGESTIONS_TABLE: !Ref HarnessSuggestionsTable
          HARNESS_VERSIONS_TABLE: !Ref HarnessVersionsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref HarnessRunSummariesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref HarnessSuggestionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref HarnessVersionsTable
      Events:
        ListHarness:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /harness
            Method: GET
        UpdateHarness:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /harness
            Method: POST

  SessionEventsReadFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src.session_events_read.handler
      Description: Read session events via cursor polling (client-facing)
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          SESSIONS_TABLE: !Ref SessionsTable
          SESSION_EVENTS_TABLE: !Ref SessionEventsTable
          SUPABASE_URL: !Ref SupabaseUrl
          SUPABASE_JWT_SECRET: !Ref SupabaseJwtSecret
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SessionsTable
        - DynamoDBReadPolicy:
            TableName: !Ref SessionEventsTable
        - DynamoDBReadPolicy:
            TableName: !Ref TeamMembershipsTable
      Events:
        ReadEvents:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /sessions/{sessionId}/events
            Method: GET

  SessionEventsIngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src.session_events_ingest.handler
      Description: Ingest a batch of session events from the agent-bridge uploader
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          SESSIONS_TABLE: !Ref SessionsTable
          MESSAGES_TABLE: !Ref MessagesTable
          SESSION_EVENTS_TABLE: !Ref SessionEventsTable
          PUSH_DEVICES_TABLE: !Ref PushDevicesTable
          COMPLETION_CALLBACK_SECRET: !Ref CompletionCallbackSecret
          APNS_PLATFORM_APPLICATION_ARN: !Ref ApnsPlatformApplicationArn
          APNS_SANDBOX_PLATFORM_APPLICATION_ARN: !Ref ApnsSandboxPlatformApplicationArn
          FCM_PLATFORM_APPLICATION_ARN: !Ref FcmPlatformApplicationArn
          LINEAR_CLIENT_ID: !Ref LinearClientId
          LINEAR_CLIENT_SECRET: !Ref LinearClientSecret
          # Needed for _notify_voice — SMSes a voice caller when run.finished
          # fires and _complete_session_and_notify fans out.
          LINQ_API_KEY: !Ref LinqApiKey
          LINQ_FROM_NUMBER: !Ref LinqFromNumber
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ServersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MessagesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionEventsTable
        - DynamoDBReadPolicy:
            TableName: !Ref TeamMembershipsTable
        - DynamoDBReadPolicy:
            TableName: !Ref PushDevicesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref HarnessRunSummariesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref HarnessSuggestionsTable
        - Statement:
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: "*"
      Events:
        IngestEvents:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /internal/sessions/{sessionId}/events
            Method: POST

  CompletionHookFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src.completion_hook.handler
      Description: Finalize a session run from the remote completion callback
      Timeout: 120
      MemorySize: 256
      Environment:
        Variables:
          SESSIONS_TABLE: !Ref SessionsTable
          MESSAGES_TABLE: !Ref MessagesTable
          PUSH_DEVICES_TABLE: !Ref PushDevicesTable
          COMPLETION_CALLBACK_SECRET: !Ref CompletionCallbackSecret
          APNS_PLATFORM_APPLICATION_ARN: !Ref ApnsPlatformApplicationArn
          APNS_SANDBOX_PLATFORM_APPLICATION_ARN: !Ref ApnsSandboxPlatformApplicationArn
          FCM_PLATFORM_APPLICATION_ARN: !Ref FcmPlatformApplicationArn
          LINEAR_CLIENT_ID: !Ref LinearClientId
          LINEAR_CLIENT_SECRET: !Ref LinearClientSecret
          # Needed for _notify_voice — SMSes a voice caller when their
          # phone-initiated session finishes.
          LINQ_API_KEY: !Ref LinqApiKey
          LINQ_FROM_NUMBER: !Ref LinqFromNumber
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ServersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MessagesTable
        - DynamoDBReadPolicy:
            TableName: !Ref PushDevicesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref HarnessRunSummariesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref HarnessSuggestionsTable
        - Statement:
            - Effect: Allow
              Action:
                - kms:Decrypt
              Resource: !GetAtt EncryptionKey.Arn
        - Statement:
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: "*"
      Events:
        CompletionHook:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /internal/sessions/{sessionId}/complete
            Method: POST

  SessionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src.sessions.handler
      Description: List sessions and messages for chat history
      Environment:
        Variables:
          SESSIONS_TABLE: !Ref SessionsTable
          MESSAGES_TABLE: !Ref MessagesTable
          SESSION_EVENTS_TABLE: !Ref SessionEventsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ServersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MessagesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionEventsTable
        - DynamoDBReadPolicy:
            TableName: !Ref TeamMembershipsTable
      Events:
        ListSessions:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /servers/{serverId}/sessions
            Method: GET
        GetMessages:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /sessions/{sessionId}/messages
            Method: GET
        DeleteSession:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /sessions/{sessionId}
            Method: DELETE
        RenameSession:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /sessions/{sessionId}
            Method: PATCH

  DebugLogFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src.debug_log.handler
      Description: Authenticated client log forwarder; lets TestFlight builds emit logs to CloudWatch (Safari Web Inspector is disabled on distribution-signed apps).
      Events:
        DebugLog:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /debug/log
            Method: POST

  PushDevicesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src.push_devices.handler
      Description: Register and unregister push devices (iOS APNs and Android FCM)
      Environment:
        Variables:
          PUSH_DEVICES_TABLE: !Ref PushDevicesTable
          APNS_PLATFORM_APPLICATION_ARN: !Ref ApnsPlatformApplicationArn
          APNS_SANDBOX_PLATFORM_APPLICATION_ARN: !Ref ApnsSandboxPlatformApplicationArn
          FCM_PLATFORM_APPLICATION_ARN: !Ref FcmPlatformApplicationArn
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PushDevicesTable
        - Statement:
            - Effect: Allow
              Action:
                - sns:CreatePlatformEndpoint
                - sns:SetEndpointAttributes
                - sns:DeleteEndpoint
              Resource: "*"
      Events:
        RegisterPushDevice:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /devices/push
            Method: POST
        UnregisterPushDevice:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /devices/push
            Method: DELETE

  AccountFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src.account.handler
      Description: Permanently delete an authenticated account and associated data
      Environment:
        Variables:
          SESSIONS_TABLE: !Ref SessionsTable
          MESSAGES_TABLE: !Ref MessagesTable
          SESSION_EVENTS_TABLE: !Ref SessionEventsTable
          PUSH_DEVICES_TABLE: !Ref PushDevicesTable
          HARNESS_RUN_SUMMARIES_TABLE: !Ref HarnessRunSummariesTable
          HARNESS_SUGGESTIONS_TABLE: !Ref HarnessSuggestionsTable
          HARNESS_VERSIONS_TABLE: !Ref HarnessVersionsTable
          OAUTH_CREDENTIALS_TABLE: !Ref OAuthCredentialsTable
          SLACK_MAPPINGS_TABLE: !Ref SlackMappingsTable
          LINEAR_MAPPINGS_TABLE: !Ref LinearMappingsTable
          SMS_MAPPINGS_TABLE: !Ref SmsMappingsTable
          SUPABASE_SERVICE_ROLE_KEY: !Ref SupabaseServiceRoleKey
          APPLE_CLIENT_ID: !Ref AppleClientId
          APPLE_TEAM_ID: !Ref AppleTeamId
          APPLE_KEY_ID: !Ref AppleKeyId
          APPLE_PRIVATE_KEY_B64: !Ref ApplePrivateKeyB64
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ServersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MessagesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionEventsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PushDevicesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref HarnessRunSummariesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref HarnessSuggestionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref HarnessVersionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref OAuthCredentialsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TeamMembershipsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TeamsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TeamInvitesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SlackMappingsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref LinearMappingsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SmsMappingsTable
        - Statement:
            - Effect: Allow
              Action:
                - ec2:TerminateInstances
                - ec2:DeleteSecurityGroup
                - ec2:DeleteKeyPair
                - ec2:ReleaseHosts
              Resource: "*"
        - Statement:
            - Effect: Allow
              Action:
                - sns:DeleteEndpoint
              Resource: "*"
      Events:
        DeleteAccount:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /account
            Method: DELETE

  WelcomeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src.welcome.handler
      Description: |
        POST /account/welcome — fire onboarding welcome email once per
        user, gated by Supabase user_metadata.welcomeEmailSent. Called
        by the web /onboarding page on mount; no-op when RESEND_API_KEY
        is unset (silent dev / pre-DNS environments).
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          SUPABASE_SERVICE_ROLE_KEY: !Ref SupabaseServiceRoleKey
          RESEND_API_KEY: !Ref ResendApiKey
          RESEND_FROM: !Ref ResendFrom
      Events:
        WelcomeEmail:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /account/welcome
            Method: POST

  TrialUsageFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src.trial_usage.handler
      Description: GET /account/trial-usage - count sessions on trial workspaces
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          # SERVERS_TABLE flows in via Globals.Function.Environment.
          SESSIONS_TABLE: !Ref SessionsTable
      Policies:
        # Handler is read-only (Query against two GSIs). Holding at
        # CRUD here so the deployed role lines up with the rest of the
        # stack's pattern; tighten to DynamoDBReadPolicy in a followup
        # once we've also flipped ScheduledEmailNudge back to Read,
        # since both downgrades will hit the EarlyValidation hook
        # together and we want to do them in one deploy.
        - DynamoDBCrudPolicy:
            TableName: !Ref ServersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
      Events:
        GetTrialUsage:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /account/trial-usage
            Method: GET

  EmailUnsubscribeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src.email_unsubscribe.handler
      Description: |
        GET /email/unsubscribe?token=<hmac> — public unauthenticated
        endpoint embedded in non-transactional emails. Validates the
        HMAC token against UNSUBSCRIBE_SECRET, sets
        user_metadata.emailUnsubscribed, returns a friendly HTML page.
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          SUPABASE_SERVICE_ROLE_KEY: !Ref SupabaseServiceRoleKey
          UNSUBSCRIBE_SECRET: !Ref UnsubscribeSecret
      Events:
        Unsubscribe:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /email/unsubscribe
            Method: GET

  ScheduledEmailNudgeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src.scheduled_email_nudge.handler
      # Lambda Description is capped at 256 chars by the API and the
      # AWS::EarlyValidation::PropertyValidation account hook rejects
      # the whole change set (with no diagnostic detail) when this
      # exceeds it. The longer rationale lives in the handler module
      # docstring; keep this one-liner.
      Description: 24h activity-nudge tick - emails users whose workspace is ready but haven't sent any sessions yet. Idempotent via user_metadata.nudgeEmailSent. Capped at 100 sends per tick.
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          SERVERS_TABLE: !Ref ServersTable
          SESSIONS_TABLE: !Ref SessionsTable
          MESSAGES_TABLE: !Ref MessagesTable
          SUPABASE_SERVICE_ROLE_KEY: !Ref SupabaseServiceRoleKey
          RESEND_API_KEY: !Ref ResendApiKey
          RESEND_FROM: !Ref ResendFrom
          UNSUBSCRIBE_SECRET: !Ref UnsubscribeSecret
          PUBLIC_API_BASE_URL: !Ref PublicApiBaseUrl
      Policies:
        # Should be DynamoDBReadPolicy (the handler is read-only — Scan
        # servers, Query sessions, no writes), but the deployed role
        # was created yesterday with DynamoDBCrudPolicy as a workaround
        # for the AWS::EarlyValidation::PropertyValidation account hook.
        # That CRUD state is now what's in prod, so any deploy that
        # tries to downgrade it to ReadPolicy makes the hook reject the
        # whole change set with no diagnostic detail. Holding it at
        # CRUD here so deploys go through. Followup: figure out what
        # the hook actually objects to about the downgrade and trim
        # back. Tracked under the hook investigation note in the
        # TrialUsageFunction block below.
        - DynamoDBCrudPolicy:
            TableName: !Ref ServersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
      Events:
        Schedule:
          Type: Schedule
          Properties:
            # Every hour. Most users don't sit perfectly on a 24h
            # boundary; the scan + filter loop handles ranges naturally.
            # Disabled on first deploy so we can sanity-check the
            # idempotency before letting it loose.
            Schedule: rate(1 hour)
            Description: |
              Tick the 24h activity-nudge sender. Re-enable via the SAM
              template (Enabled: true) or the EventBridge console.
            Enabled: false

  OAuthCredentialsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src.oauth_credentials.handler
      Description: Store provider tokens needed for future account cleanup
      Environment:
        Variables:
          OAUTH_CREDENTIALS_TABLE: !Ref OAuthCredentialsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OAuthCredentialsTable
        - Statement:
