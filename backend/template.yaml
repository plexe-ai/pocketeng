  # ─── Voice (Retell AI) Integration ───────────────────────────────────────────

  VoiceToolsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src.voice_tools.handler
      Description: Retell AI webhook — list/read/send for voice-agent tool calls
      # 60s gives us room for SSH handshake + _launch_turn. Retell's default
      # tool timeout is lower, so the caller will hear a "hmm, one sec" fill
      # if we go over; we should keep the common case under 3s.
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          SMS_MAPPINGS_TABLE: !Ref SmsMappingsTable
          SESSIONS_TABLE: !Ref SessionsTable
          MESSAGES_TABLE: !Ref MessagesTable
          PUSH_DEVICES_TABLE: !Ref PushDevicesTable
          AGENT_CREDENTIALS_TABLE: !Ref AgentCredentialsTable
          HARNESS_RUN_SUMMARIES_TABLE: !Ref HarnessRunSummariesTable
          HARNESS_SUGGESTIONS_TABLE: !Ref HarnessSuggestionsTable
          PUBLIC_API_BASE_URL: !Ref PublicApiBaseUrl
          COMPLETION_CALLBACK_SECRET: !Ref CompletionCallbackSecret
          RETELL_WEBHOOK_SECRET: !Ref RetellWebhookSecret
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SmsMappingsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ServersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MessagesTable
        - DynamoDBReadPolicy:
            TableName: !Ref PushDevicesTable
        - DynamoDBReadPolicy:
            TableName: !Ref AgentCredentialsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref HarnessRunSummariesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref HarnessSuggestionsTable
        - Statement:
            - Effect: Allow
              Action:
                - ec2:DescribeInstances
                - ec2:StartInstances
              Resource: "*"
        - Statement:
            - Effect: Allow
              Action:
                - kms:Decrypt
              Resource: !GetAtt EncryptionKey.Arn
      Events:
        VoiceRetell:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /voice/retell
            Method: POST

  LifecycleFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src.lifecycle.handler
      Description: Auto-stop idle instances
      Timeout: 120
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ServersTable
        - Statement:
            - Effect: Allow
              Action:
                - ec2:StopInstances
                - ec2:TerminateInstances
                - ec2:DeleteSecurityGroup
                - ec2:DeleteKeyPair
                - ec2:DescribeInstances
                - ec2:ReleaseHosts
              Resource: "*"
      Events:
        Schedule:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Description: Check for idle servers every 5 minutes
            Enabled: false

  # ─── DynamoDB Tables ──────────────────────────────────────────────────────────

  ServersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub pe-servers-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: serverId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: teamId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: serverId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: userId-index
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: teamId-createdAt-index
          KeySchema:
            - AttributeName: teamId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  TeamsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub pe-teams-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: teamId
          AttributeType: S
      KeySchema:
        - AttributeName: teamId
          KeyType: HASH

  TeamMembershipsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub pe-team-memberships-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: teamId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: teamId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: teamId-userId-index
          KeySchema:
            - AttributeName: teamId
              KeyType: HASH
            - AttributeName: userId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  TeamInvitesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub pe-team-invites-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: inviteId
          AttributeType: S
        - AttributeName: email
          AttributeType: S
        - AttributeName: teamId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: inviteId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: email-createdAt-index
          KeySchema:
            - AttributeName: email
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: teamId-createdAt-index
          KeySchema:
            - AttributeName: teamId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  SlackMappingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub pe-slack-mappings-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: slackTeamId
          AttributeType: S
      KeySchema:
        - AttributeName: slackTeamId
          KeyType: HASH

  SmsMappingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub pe-sms-mappings-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: phoneNumber
          AttributeType: S
      KeySchema:
        - AttributeName: phoneNumber
          KeyType: HASH

  LinearMappingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub pe-linear-mappings-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: linearTeamId
          AttributeType: S
      KeySchema:
        - AttributeName: linearTeamId
          KeyType: HASH

  HarnessRunSummariesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub pe-harness-runs-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: createdAt
          KeyType: RANGE

  HarnessSuggestionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub pe-harness-suggestions-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: itemId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: itemId
          KeyType: RANGE

  HarnessVersionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub pe-harness-versions-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: versionSeq
          AttributeType: N
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: versionSeq
          KeyType: RANGE

  SessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub pe-sessions-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: sessionId
          AttributeType: S
        - AttributeName: serverId
          AttributeType: S
        - AttributeName: updatedAt
          AttributeType: S
      KeySchema:
        - AttributeName: sessionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: serverId-updatedAt-index
          KeySchema:
            - AttributeName: serverId
              KeyType: HASH
            - AttributeName: updatedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  MessagesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub pe-messages-${Stage}
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      AttributeDefinitions:
        - AttributeName: sessionId
          AttributeType: S
        - AttributeName: seq
          AttributeType: N
      KeySchema:
        - AttributeName: sessionId
          KeyType: HASH
        - AttributeName: seq
          KeyType: RANGE

  SessionEventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub pe-session-events-${Stage}
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      AttributeDefinitions:
        - AttributeName: sessionId
          AttributeType: S
        - AttributeName: seq
          AttributeType: N
      KeySchema:
        - AttributeName: sessionId
          KeyType: HASH
        - AttributeName: seq
          KeyType: RANGE

  PushDevicesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub pe-push-devices-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: installationId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: updatedAt
          AttributeType: S
      KeySchema:
        - AttributeName: installationId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: userId-updatedAt-index
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: updatedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  OAuthCredentialsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub pe-oauth-credentials-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: provider
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: provider
          KeyType: RANGE

  AgentCredentialsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub pe-agent-credentials-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: agent
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: agent
          KeyType: RANGE

  AwsCredentialsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub pe-aws-credentials-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  # ─── KMS Key ─────────────────────────────────────────────────────────────────

  EncryptionKey:
    Type: AWS::KMS::Key
    Properties:
      Description: PocketEngineer — encrypts SSH keys and API keys at rest
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowRootAccess
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: "*"

  EncryptionKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/pocketeng
      TargetKeyId: !Ref EncryptionKey

Outputs:
  ApiUrl:
    Description: API Gateway URL
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  ServersTableName:
    Value: !Ref ServersTable
  PushDevicesTableName:
    Value: !Ref PushDevicesTable
  KmsKeyId:
    Value: !Ref EncryptionKey
